
services:
  backend:
    build: ./backend
    container_name: cx-reply-backend
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cx-reply-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
